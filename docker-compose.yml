services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: Ibraheem
    container_name: ImageConverter
    ports:
      - 9092:9092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # Postgres for order-service's image_jobs table. wal_level=logical lets Debezium read the change log.
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Kafka Connect (distributed mode) using Debezium's image, which ships the Debezium Postgres connector.
  # The FileStream connectors are in /kafka/libs but not on the plugin path by default,
  # so they are copied into the plugin directory on startup.
  kafka-connect:
    image: quay.io/debezium/connect:2.7.3.Final
    container_name: kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      ADVERTISED_HOST_NAME: kafka-connect
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /kafka/connect/file && cp /kafka/libs/connect-file-*.jar /kafka/connect/file/
        exec /docker-entrypoint.sh start
    volumes:
      - ./connect/data:/data
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-shot job that registers the connectors in ./connect/connectors once Connect's REST API is up.
  kafka-connect-init:
    image: curlimages/curl:8.10.1
    volumes:
      - ./connect/connectors:/connectors:ro
    entrypoint:
      - sh
      - -c
      - |
        until curl -sf http://kafka-connect:8083/connectors > /dev/null; do echo "waiting for Kafka Connect..."; sleep 5; done
        for file in /connectors/*.json; do
          name=$$(basename "$$file" .json)
          echo "registering $$name"
          curl -sf -X PUT -H "Content-Type: application/json" --data @"$$file" "http://kafka-connect:8083/connectors/$$name/config"
          echo
        done
    depends_on:
      - kafka-connect
    restart: "no"
