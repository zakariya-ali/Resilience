# Start both services:            docker compose up --build
# Start Order Service unprotected: ORDER_PROFILE=unprotected docker compose up --build
services:
  inventory-service:
    build: ./inventory-service
    ports:
      - "8081:8081"
    environment:
      INVENTORY_MODE: NORMAL          # default behaviour; requests can override with ?mode=

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${ORDER_PROFILE:-protected}   # protected | unprotected
      INVENTORY_BASE_URL: http://inventory-service:8081
    depends_on:
      - inventory-service

  # Optional: run k6 without installing it locally, e.g.
  #   docker compose run --rm k6 run /scripts/normal-traffic.js
  # Only started on demand (profile "loadtest").
  k6:
    image: grafana/k6:0.54.0
    profiles: ["loadtest"]
    volumes:
      - ./k6:/scripts
    environment:
      BASE_URL: http://order-service:8080
      INVENTORY_URL: http://inventory-service:8081
    depends_on:
      - order-service
