server:
  port: 8081
  tomcat:
    threads:
      # Deliberately small so the dependency has LIMITED CAPACITY, like a real
      # struggling service. Under heavy load extra requests have to queue.
      max: 20

spring:
  application:
    name: inventory-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-image-converter
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        max.partition.fetch.bytes: 10485760
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        max.request.size: 10485760

inventory:
  image-input-topic: image-uploaded
  image-output-topic: image-converted

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
